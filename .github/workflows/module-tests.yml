name: Terraform Module Tests
on:
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preload:
    name: Preload
    runs-on: ubuntu-latest
    outputs:
      tests_enabled: ${{ steps.config.outputs.tests_enabled }}
      tests_engine: ${{ steps.config.outputs.tests_engine }}
      tests_version: ${{ steps.config.outputs.tests_version }}
      tests_directory: ${{ steps.config.outputs.tests_directory }}
    steps:
      - name: Checkout w/Blueprint
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        with:
          token: ${{ secrets.BOT_TOKEN }}
          blueprint_ref: 'v5.10'

      - name: Pipeline Configuration
        id: config
        uses: ./bp/ci/config/terraform

  test:
    name: Module Tests
    runs-on: ubuntu-latest
    needs:
      - preload
    if: ${{ needs.preload.outputs.tests_enabled == 'true' }}
    steps:
      - name: Checkout w/Blueprint
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        id: co
        with:
          token: ${{ secrets.BOT_TOKEN }}
          blueprint_ref: 'v5.10'

      - name: Run Module Tests
        uses: ./bp/ci/terraform/test
        with:
          source_path: ${{ steps.co.outputs.source_path }}
          engine: ${{ needs.preload.outputs.tests_engine }}
          version: ${{ needs.preload.outputs.tests_version }}
          test_directory: ${{ needs.preload.outputs.tests_directory }}
