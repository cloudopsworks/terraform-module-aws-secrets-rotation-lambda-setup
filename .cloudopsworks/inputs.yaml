# JIRA Integration for Release Management
#jira:
#  enabled: true | false # Defaults to true, set to false to disable, JIRA_INTEGRATION_ENABLED at organization setting enables or disables globally
#  project_id: "PROJECT ID NUMBER" # Optional, if not set will default to JIRA_INTEGRATION_PROJECT_ID from organization
#  project_key: "PROJECT KEY" # Optional,  if not set will default to JIRA_INTEGRATION_PROJECT_KEY from organization
#
#checkov:
#  enabled: true | false # Defaults to true, set to false to disable
#
#secret_scan:
#  enabled: true | false # Defaults to true, set to false to disable
#
#semgrep:
#  enabled: true | false # Defaults to true, set to false to disable
#
# Module tests (blueprint ci/terraform/test), run by .github/workflows/module-tests.yml on pull request open/update
#tests:
#  enabled: true | false # Defaults to true, set to false to disable
#  engine: tofu | terraform # Defaults to tofu
#  version: "latest" # Defaults to latest, accepts an exact version (e.g. "1.11.4") or a constraint
#  directory: "tests" # Defaults to tests, directory holding *.tftest.hcl / *.tofutest.hcl files
